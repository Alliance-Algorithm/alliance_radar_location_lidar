static_transforms:
  # radar_base 定义在相机光心处。
  # 坐标系约定 (REP-103): x 朝前, y 朝左, z 朝上。
  # 雷达安装位置: 相机左侧 8 cm, 高 2 cm, 无偏航/俯仰/横滚。
  radar_base_to_lidar:
    parent: "radar_base"
    child: "lidar_link"
    translation: {x: 0.0, y: 0.08, z: 0.02}
    rotation: {qx: 0.0, qy: 0.0, qz: 0.0, qw: 1.0}

  radar_base_to_camera:
    parent: "radar_base"
    child: "camera_link"
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation: {qx: 0.0, qy: 0.0, qz: 0.0, qw: 1.0}

  camera_to_optical:
    parent: "camera_link"
    child: "camera_optical_frame"
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation: {qx: -0.5, qy: 0.5, qz: -0.5, qw: 0.5}
