radar_recorder_node:
  ros__parameters:
    shm_name: "/hikcamera_shm"
    width: 5472
    height: 3648
    enable_raw_recording: false
    recording_output_dir: "/workspace/model/video"
    recording_width: 5472
    recording_height: 3648
    recording_fps: 8
    recording_bitrate: 25000000  # 25Mbps ≈ 5.6GB/30min，保留小目标细节
    recording_gop: 20
    recording_encoder: "hevc_nvenc"
    recording_segment_duration_sec: 0  # 整段录制
    recording_buffer_pool_frames: 8
    recording_max_buffer_bytes: 480000000
