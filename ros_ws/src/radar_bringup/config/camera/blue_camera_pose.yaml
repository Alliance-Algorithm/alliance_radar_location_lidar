radar_camera_node:
  ros__parameters:
    # 蓝方相机在地图坐标系中的位姿
    # 由蓝方雷达初始位姿 (tx=+14.95, ty=+0.85, tz=3.84, pitch=+12.46° 低头, yaw=189°) + 传感器外参推算
    # 相机 pitch 约定: pi/2 + 俯角 (光轴 +Z 从水平低头指向场地中心) => 1.788264 rad = 102.46°
    # 雷达在相机左8cm高2cm => 相机在雷达右-0.08m低-0.02m
    rotation: [0.0, 1.788264, 3.2985036]
    translation: [14.9465, 0.9300, 3.8200]
