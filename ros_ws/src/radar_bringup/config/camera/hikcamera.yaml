hikcamera_ros_driver_node:
  ros__parameters:
    # 白平衡（单次自动）
    white_balance_blue: 512
    white_balance_red: 512
    white_balance_green: 512
    auto_white_balance: 1

    # 曝光与增益（对齐 HKUST ENTERPRIZE 验证配置：同款 MV-CS200-10UC 用
    # exposure 10ms + gain 23 全国赛局均易伤第一；检测率主因是目标距离非画面亮度）
    exposure_us: 10000.0
    gain: 23.0

    # 帧率（CS200-10UC USB3 稳定 20fps）
    framerate: 20.0

    # 原生分辨率 5472×3648
    width: 5472
    height: 3648

    # 相机控制
    timeout_ms: 2000
    invert_image: false
    software_sync: false
    trigger_mode: false
    fixed_framerate: true

    # 图像话题
    image_topic: "/camera/image_raw"

    # 共享内存名
    shm_name: "/hikcamera_shm"

    # 相机序列号 SN（多相机时按序列号选设备；留空=仅1台相机时自动选用）
    device_serial: "DB0067863"
