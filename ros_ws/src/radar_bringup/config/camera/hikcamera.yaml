hikcamera_ros_driver_node:
  ros__parameters:
    # 白平衡（单次自动）
    white_balance_blue: 512
    white_balance_red: 512
    white_balance_green: 512
    auto_white_balance: 1

    # 曝光与增益（10ms/gain23 画面偏亮 18.1；降到 7.5ms/gain20 对齐可检测基线 ~13，
    # 减少过曝/饱和——对比 HKU 标注视频与 99% 检出抽帧的画面特征）
    exposure_us: 7500.0
    gain: 20.0

    # 帧率（CS200-10UC USB3 稳定 20fps）
    framerate: 20.0

    # 原生分辨率 5472×3648
    width: 5472
    height: 3648

    # 相机控制
    timeout_ms: 2000
    invert_image: false
    software_sync: false
    trigger_mode: false
    fixed_framerate: true

    # 图像话题
    image_topic: "/camera/image_raw"

    # 共享内存名
    shm_name: "/hikcamera_shm"

    # 相机序列号 SN（多相机时按序列号选设备；留空=仅1台相机时自动选用）
    device_serial: "DB0067863"
