radar_camera_node:
  ros__parameters:
    # 红方相机在地图坐标系中的位姿
    # 由外参链严格推导: R = Rz(lidar_yaw 8.99°)·Ry(12.46°)·R_opt, R_opt = 循环置换
    # [[0,0,1],[-1,0,0],[0,-1,0]] (z→x, x→-y, y→-z, 不是 Ry(90°))
    # 整体按 Rz·Ry·Rx 分解 => roll=-102.46°, pitch=0, yaw=-81.01° (射线实测命中 95.7%)
    # 平移: 红方雷达 (-14.95, -0.85, 3.84) + 外参 (x+0.0035, y-0.08, z-0.02)
    rotation: [-1.7882643, 0.0, -1.4138676]
    translation: [-14.9418, -0.9297, 3.8205]
