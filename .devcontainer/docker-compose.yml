services:
  radar-develop:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: radar:develop
    user: "1000:1000"
    privileged: true
    volumes:
      # Project source (bind mount)
      - type: bind
        source: ..
        target: /workspace
      # Device access
      - type: bind
        source: /dev
        target: /dev
      # X11 display
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      # Host opencode config (any device's ~/.opencode)
      - ${HOME}/.opencode:/home/ubuntu/.opencode:cached
      # Host codex config
      - ${HOME}/.codex:/home/ubuntu/.codex:cached
      # Host mimocode config
      - ${HOME}/.mimocode:/home/ubuntu/.mimocode:cached
      # Host XDG config (optional, for shared tool settings)
      - ${HOME}/.config/opencode:/home/ubuntu/.config/opencode:cached
      # Host Neovim config (for container-side nvim LSP)
      - ${HOME}/.config/nvim:/home/ubuntu/.config/nvim:cached
      - ${HOME}/.local/share/nvim:/home/ubuntu/.local/share/nvim:cached
      # Host-built TensorRT/CUDA runtime and headers for radar_camera.
      # Prepare with .script/prepare-radar-camera-tensorrt-runtime on the host.
      - ${RADAR_TENSORRT_STAGE:-/tmp/radar_camera_trt_host}:/opt/radar_camera_trt:ro
      # Host SSH keys (read-only) — enables git push over SSH
      - ${HOME}/.ssh:/home/ubuntu/.ssh:ro
      # Host gh CLI auth (read-write) — enables gh pr create
      - ${HOME}/.config/gh:/home/ubuntu/.config/gh:cached
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      # video 能力供 NVENC 硬件编码（默认内录 h264_nvenc 必需）
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - RADAR_CAMERA_TENSORRT_ROOT=/opt/radar_camera_trt
      - LD_LIBRARY_PATH=/opt/radar_camera_trt/lib:/opt/ros/jazzy/lib:${LD_LIBRARY_PATH}
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    network_mode: host
    tty: true
    stdin_open: true
