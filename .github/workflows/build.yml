name: Build & Format Check
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Init submodules
        run: |
          git config --global --add safe.directory /__w/alliance_radar_location_lidar/alliance_radar_location_lidar
          git submodule update --init --recursive --jobs 4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget gnupg \
             libopencv-dev libassimp-dev libeigen3-dev \
             libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg pkg-config \
             libzmq3-dev libyaml-cpp-dev libomp-dev libpcl-dev
          pkg-config --modversion libavcodec libavformat libavutil libswscale
          # grep -q would close the pipe early and SIGPIPE-kill ffmpeg (exit 141);
          # write to a file first. h264_nvenc is unavailable without GPU — not fatal.
          ffmpeg -hide_banner -encoders > /tmp/ff_encoders.txt 2>&1 || true
          grep -q h264_nvenc /tmp/ff_encoders.txt || echo "note: h264_nvenc unavailable (no GPU in CI)"
          mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            gpg --dearmor -o /etc/apt/keyrings/apt.llvm.org.gpg
          chmod 644 /etc/apt/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends clang-format-22
          update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 50

      - name: Install ROS deps
        run: |
          rosdep update
          rosdep install --from-paths ros_ws/src ros_ws/third-party --ignore-src -r -y

      - name: Build third-party (small_gicp + hikcamera + hikcamera_ros_driver)
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros_ws
          colcon build --packages-select small_gicp hikcamera hikcamera_ros_driver \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -Wno-dev

      - name: Format check (clang-format)
        run: |
          find ros_ws/src \
            -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
